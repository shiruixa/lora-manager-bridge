<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoRA Manager Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">🔗 LoRA Manager Bridge</h1>
      <p class="subtitle">CivitAI ↔ ComfyUI LoRA Manager</p>
    </header>

    <section class="status-section">
      <div class="status-row">
        <span class="status-label">ComfyUI 状态</span>
        <span id="server-status" class="status-value status--checking">检查中…</span>
      </div>
      <div class="status-row">
        <span class="status-label">库中模型</span>
        <span id="lora-count" class="status-value">--</span>
      </div>
      <div class="status-row">
        <span class="status-label">LoRA/CKPT/EMB/其它</span>
        <span id="type-count" class="status-value status-mono">--</span>
      </div>
      <div class="status-row">
        <span class="status-label">当前页面</span>
        <span id="current-page" class="status-value status-page">--</span>
      </div>
      <div class="status-row" id="page-status-row" hidden>
        <span class="status-label">本页标记</span>
        <span id="page-status" class="status-value status-page">--</span>
      </div>
    </section>

    <section id="notices" class="notices" hidden>
      <h2 class="notices-title">
        下载
        <span class="notices-tools">
          <span id="notices-count" class="notices-count"></span>
          <button type="button" id="btn-clear-log" class="notices-clear" title="清空">清空</button>
        </span>
      </h2>
      <ul id="notices-list" class="notices-list"></ul>
    </section>

    <p id="hint" class="hint" hidden></p>

    <section class="actions">
      <button id="btn-refresh" class="btn btn-primary">🔄 重新检查本页</button>
      <div class="actions-row">
        <button id="btn-open-lm" class="btn btn-secondary">📂 LoRA Manager</button>
        <button id="btn-options" class="btn btn-secondary">⚙️ 设置</button>
      </div>
    </section>

    <footer class="footer">
      <small>ComfyUI 地址可在设置中配置</small>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
